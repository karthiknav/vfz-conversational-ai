        Statement:
          - { Effect: Allow, Principal: { Service: codebuild.amazonaws.com }, Action: sts:AssumeRole }
      Policies:
        - PolicyName: DeployPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - { Effect: Allow, Action: ["logs:CreateLogStream", "logs:PutLogEvents"], Resource: !GetAtt BluemarbleDeployLogGroup.Arn }
              - { Effect: Allow, Action: ["ecs:DescribeTaskDefinition", "ecs:RegisterTaskDefinition"], Resource: "*" }
              - Effect: Allow
                Action: ["ecs:DescribeServices", "ecs:UpdateService"]
                Resource: !Sub
                  - "arn:aws:ecs:${AWS::Region}:${AWS::AccountId}:service/${ClusterName}/${ServiceName}"
                  - ClusterName: !ImportValue { "Fn::Sub": "${GatewayEcsClusterStackName}-ClusterName" }
                    ServiceName: !ImportValue { "Fn::Sub": "${GatewayServicesStackName}-BluemarbleServiceName" }
              - Effect: Allow
                Action: iam:PassRole
                Resource: "*"
                Condition: { StringEquals: { "iam:PassedToService": "ecs-tasks.amazonaws.com" } }

  BluemarbleDeployProject:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub "${EnvironmentName}-mock-bluemarble-deploy"
      ServiceRole: !GetAtt BluemarbleDeployRole.Arn
      Artifacts: { Type: CODEPIPELINE }
      Source: { Type: CODEPIPELINE, BuildSpec: services/mock-bluemarble/deployspec.yml }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:7.0
        EnvironmentVariables:
          - { Name: TASK_DEFINITION_FAMILY, Value: !Sub "${EnvironmentName}-mock-bluemarble" }
          - { Name: CONTAINER_NAME, Value: mock-bluemarble }
          - { Name: ECS_CLUSTER_NAME, Value: !ImportValue { "Fn::Sub": "${GatewayEcsClusterStackName}-ClusterName" } }
          - { Name: ECS_SERVICE_NAME, Value: !ImportValue { "Fn::Sub": "${GatewayServicesStackName}-BluemarbleServiceName" } }
          - { Name: AWS_DEFAULT_REGION, Value: !Ref AWS::Region }
      LogsConfig: { CloudWatchLogs: { GroupName: !Ref BluemarbleDeployLogGroup, Status: ENABLED } }

  BluemarblePipeline:
    Type: AWS::CodePipeline::Pipeline
    Properties:
      Name: !Sub "${EnvironmentName}-mock-bluemarble-pipeline"
      PipelineType: V2
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore: { Type: S3, Location: !ImportValue { "Fn::Sub": "${CicdFoundationStackName}-ArtifactBucketName" } }
      Triggers:
        - ProviderType: CodeStarSourceConnection
          GitConfiguration:
            SourceActionName: Source
            Push:
              - Branches: { Includes: [!Ref BranchName] }
                FilePaths: { Includes: ["services/mock-bluemarble/**"] }
      Stages:
