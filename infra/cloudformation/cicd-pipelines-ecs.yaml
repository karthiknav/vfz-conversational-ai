        PrivilegedMode: true
        EnvironmentVariables:
          - { Name: ECR_REPO_URI, Value: !ImportValue { "Fn::Sub": "${EcrStackName}-MockBluemarbleRepoUri" } }
          - { Name: CONTAINER_NAME, Value: mock-bluemarble }
          - { Name: AWS_DEFAULT_REGION, Value: !Ref AWS::Region }
      LogsConfig: { CloudWatchLogs: { GroupName: !Ref BluemarbleBuildLogGroup, Status: ENABLED } }

  BluemarbleDeployLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub "/codebuild/${EnvironmentName}-mock-bluemarble-deploy", RetentionInDays: 14 }

  BluemarbleDeployRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-mock-bluemarble-cicd-deploy-role"
