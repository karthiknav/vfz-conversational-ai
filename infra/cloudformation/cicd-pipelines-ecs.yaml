  # ==================================================================
  # mock-salesforce
  # ==================================================================
  SalesforceBuildLogGroup:
    Type: AWS::Logs::LogGroup
    Properties: { LogGroupName: !Sub "/codebuild/${EnvironmentName}-mock-salesforce-build", RetentionInDays: 14 }

