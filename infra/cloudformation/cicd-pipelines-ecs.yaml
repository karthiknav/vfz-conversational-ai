      PipelineType: V2
      RoleArn: !GetAtt PipelineRole.Arn
      ArtifactStore: { Type: S3, Location: !ImportValue { "Fn::Sub": "${CicdFoundationStackName}-ArtifactBucketName" } }
      Triggers:
