Outputs:
  GatewayPipelineName: { Value: !Ref GatewayPipeline, Export: { Name: !Sub "${AWS::StackName}-GatewayPipelineName" } }
  BluemarblePipelineName: { Value: !Ref BluemarblePipeline, Export: { Name: !Sub "${AWS::StackName}-BluemarblePipelineName" } }
  SalesforcePipelineName: { Value: !Ref SalesforcePipeline, Export: { Name: !Sub "${AWS::StackName}-SalesforcePipelineName" } }
