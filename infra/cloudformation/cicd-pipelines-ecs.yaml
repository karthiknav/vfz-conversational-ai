      Name: !Sub "${EnvironmentName}-mock-bluemarble-build"
      ServiceRole: !GetAtt BluemarbleBuildRole.Arn
      Artifacts: { Type: CODEPIPELINE }
      Source: { Type: CODEPIPELINE, BuildSpec: services/mock-bluemarble/buildspec.yml }
      Environment:
        Type: LINUX_CONTAINER
        ComputeType: BUILD_GENERAL1_SMALL
