AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Secrets shared between the two compute platforms: gateway-api-key (read by
  both gateway-mcp's ECS task and the orchestrator's EKS pods — we generate
  it ourselves since we own both sides) and Langfuse Cloud keys (orchestrator
  only; populate manually post-deploy, see Outputs).

Parameters:
  EnvironmentName:
    Type: String
    Default: vfz-poc

Resources:
  GatewayApiKeySecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${EnvironmentName}/gateway-api-key"
      GenerateSecretString:
        SecretStringTemplate: "{}"
        GenerateStringKey: api_key
        PasswordLength: 40
        ExcludePunctuation: true

  LangfuseSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "${EnvironmentName}/langfuse-keys"
      Description: "Placeholder — populate public_key/secret_key manually after deploy; orchestrator no-ops tracing if absent."
      SecretString: '{"public_key":"","secret_key":""}'

Outputs:
  GatewayApiKeySecretArn:
    Value: !Ref GatewayApiKeySecret
    Export: { Name: !Sub "${AWS::StackName}-GatewayApiKeySecretArn" }
  LangfuseSecretArn:
    Value: !Ref LangfuseSecret
    Export: { Name: !Sub "${AWS::StackName}-LangfuseSecretArn" }
