AWSTemplateFormatVersion: "2010-09-09"
Description: >
  Managed node group for the orchestrator's EKS cluster, in the eks-private
  subnets only.

Parameters:
  EnvironmentName:
    Type: String
    Default: vfz-poc
  NetworkStackName:
    Type: String
    Default: vfz-network
  EksClusterStackName:
    Type: String
    Default: vfz-eks-cluster
  InstanceType:
    Type: String
    Default: t3.medium
  DesiredSize:
    Type: Number
    Default: 2
  MinSize:
    Type: Number
    Default: 2
  MaxSize:
    Type: Number
    Default: 3

Resources:
  # Managed node groups auto-generate a launch template when none is given,
  # and that auto-generated one defaults IMDSv2's HttpPutResponseHopLimit to
  # 1 — enough for processes on the host, but one hop too few for a pod
  # (bridge network adds a hop), so any in-pod IMDS call times out. This is
  # what broke the AWS Load Balancer Controller's own VPC-ID discovery on
  # first boot; bumping the hop limit to 2 here fixes it for every pod on
  # every node, not just that one controller.
  NodeLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateName: !Sub "${EnvironmentName}-eks-node-lt"
      LaunchTemplateData:
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 2

  NodeRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-eks-node-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: { Service: ec2.amazonaws.com }
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/AmazonEKSWorkerNodePolicy
        - arn:aws:iam::aws:policy/AmazonEC2ContainerRegistryReadOnly
        - arn:aws:iam::aws:policy/AmazonEKS_CNI_Policy

  NodeGroup:
    Type: AWS::EKS::Nodegroup
    Properties:
      ClusterName: !ImportValue { "Fn::Sub": "${EksClusterStackName}-ClusterName" }
      NodegroupName: !Sub "${EnvironmentName}-orchestrator-nodes"
      NodeRole: !GetAtt NodeRole.Arn
      InstanceTypes: [!Ref InstanceType]
      AmiType: AL2023_x86_64_STANDARD
      LaunchTemplate:
        Id: !Ref NodeLaunchTemplate
        Version: !GetAtt NodeLaunchTemplate.LatestVersionNumber
      Subnets:
        - !ImportValue { "Fn::Sub": "${NetworkStackName}-EksPrivateSubnet1Id" }
        - !ImportValue { "Fn::Sub": "${NetworkStackName}-EksPrivateSubnet2Id" }
      ScalingConfig:
        DesiredSize: !Ref DesiredSize
        MinSize: !Ref MinSize
        MaxSize: !Ref MaxSize
      UpdateConfig:
        MaxUnavailable: 1

Outputs:
  NodeRoleArn:
    Value: !GetAtt NodeRole.Arn
    Export: { Name: !Sub "${AWS::StackName}-NodeRoleArn" }
  NodegroupName:
    Value: !Ref NodeGroup
    Export: { Name: !Sub "${AWS::StackName}-NodegroupName" }
