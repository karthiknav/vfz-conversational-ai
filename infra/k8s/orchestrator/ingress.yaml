# Requires the AWS Load Balancer Controller installed cluster-wide first —
# see infra/k8s/README.md "Cluster bootstrap". Creates a public ALB with
# both an HTTP listener (redirecting to HTTPS) and an HTTPS listener using
# the ACM cert from infra/cloudformation/orchestrator-tls.yaml. The Route53
# alias record pointing that cert's domain at this ALB isn't created here —
# the ALB doesn't exist until this Ingress is applied, so it's a separate
# step after the fact (see infra/cloudformation/README.md step 7).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: orchestrator
  namespace: orchestrator
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/healthcheck-path: /health
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: __ORCHESTRATOR_CERT_ARN__
    alb.ingress.kubernetes.io/ssl-redirect: "443"
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: orchestrator
                port: { number: 8000 }
