# Requires the Secrets Store CSI Driver + AWS provider (ASCP) installed
# cluster-wide first — see infra/k8s/README.md "Cluster bootstrap".
# objectName values below must match app-secrets.yaml/data.yaml's Secrets
# Manager secret names and gateway-services.yaml's SSM parameter name for
# the EnvironmentName you deployed with (default "vfz-poc").
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: orchestrator-secrets
  namespace: orchestrator
spec:
  provider: aws
  parameters:
    region: __AWS_REGION__
    objects: |
      - objectName: "vfz-poc/gateway-api-key"
        objectType: "secretsmanager"
        jmesPath:
          - path: "api_key"
            objectAlias: "gateway-api-key-value"
      - objectName: "vfz-poc/db-credentials"
        objectType: "secretsmanager"
        jmesPath:
          - path: "username"
            objectAlias: "db-username"
          - path: "password"
            objectAlias: "db-password"
      - objectName: "vfz-poc/langfuse-keys"
        objectType: "secretsmanager"
        jmesPath:
          - path: "public_key"
            objectAlias: "langfuse-public-key"
          - path: "secret_key"
            objectAlias: "langfuse-secret-key"
      - objectName: "/vfz-poc/gateway-mcp-url"
        objectType: "ssmparameter"
        objectAlias: "gateway-mcp-url"
  secretObjects:
    - secretName: orchestrator-secrets
      type: Opaque
      data:
        - objectName: gateway-api-key-value
          key: GATEWAY_API_KEY
        - objectName: db-username
          key: POSTGRES_USER
        - objectName: db-password
          key: POSTGRES_PASSWORD
        - objectName: langfuse-public-key
          key: LANGFUSE_PUBLIC_KEY
        - objectName: langfuse-secret-key
          key: LANGFUSE_SECRET_KEY
        - objectName: gateway-mcp-url
          key: GATEWAY_MCP_URL
