version: 0.2

# ORCHESTRATOR_DOMAIN is the fixed HTTPS domain from
# infra/cloudformation/orchestrator-tls.yaml (e.g.
# orchestrator.<your-domain>), not the raw ALB hostname — the domain
# survives Ingress/ALB recreation as long as the Route53 alias record is
# kept pointed at the current ALB (see infra/cloudformation/README.md
# step 7), so this build no longer needs to read anything live from the
# EKS API.

phases:
  install:
    runtime-versions:
      nodejs: 20
  pre_build:
    commands:
      - test -n "$ORCHESTRATOR_DOMAIN" || (echo "ORCHESTRATOR_DOMAIN is not set" && exit 1)
      - ORCHESTRATOR_BASE_URL="https://${ORCHESTRATOR_DOMAIN}"
      - >
        sed -i "s#<script type=\"module\" src=\"/src/main.js\"></script>#<script>window.ORCHESTRATOR_BASE_URL = \"${ORCHESTRATOR_BASE_URL}\";</script>\n  <script type=\"module\" src=\"/src/main.js\"></script>#"
        services/ui/index.html
  build:
    commands:
      - cd services/ui && npm ci && npm run build

artifacts:
  base-directory: services/ui/dist
  files:
    - "**/*"
